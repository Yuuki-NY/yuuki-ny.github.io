name Deploy to GitHub Pages

on
  push
    branches [main]

permissions
  contents read
  pages write
  id-token write

concurrency
  group pages
  cancel-in-progress true

jobs
  deploy
    environment
      name github-pages
      url ${{ steps.deployment.outputs.page_url }}
    runs-on ubuntu-latest
    steps
      - name Checkout
        uses actionscheckout@v4

      - name Setup Pages
        uses actionsconfigure-pages@v5

      - name Upload artifact
        uses actionsupload-pages-artifact@v3
        with
          path 'index.html'   # change if index.html is in a subfolder, e.g. '.public'

      - name Deploy to GitHub Pages
        id deployment
        uses actionsdeploy-pages@v4
